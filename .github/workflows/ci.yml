name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Frontend (ESLint, TypeScript & Storefront Widget)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      # shortcut: Placeholder for upcoming Theme App Extension asset check; activate in Sprint 1/2
      - name: "[Placeholder] Storefront Theme Extension Bundle Budget (<30KB)"
        run: |
          echo "Theme App Extension asset verification will run here when storefront widget is built (Sprint 1-T4)."

  backend:
    name: Backend (PHPUnit Tests, Migrations & Security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: actions/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pgsql, bcmath, pcntl, zip, redis
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run automated PHPUnit tests
        run: php artisan test

      # Security verification: Ensure zero raw card PAN/CVVs and no committed secrets (PCI SAQ-A scope)
      - name: PCI SAQ-A & Secret Scan Check
        run: |
          echo "Verifying PCI SAQ-A compliance (zero raw card data or unencrypted API secrets in repo)..."
          ! git grep -iE '4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|sk_live_[0-9a-zA-Z]{24}' -- ':!*.lock' ':!node_modules' ':!vendor' || {
            echo "Potential secret or card PAN detected!"; exit 1;
          }

      # shortcut: Placeholder for Stripe webhook simulation; activate in Sprint 3 (S3-T1)
      - name: "[Placeholder] Stripe Webhook Idempotency & Signature Verification"
        run: |
          echo "Stripe webhook idempotency test suite will execute here upon Sprint 3 completion."

      # shortcut: Placeholder for Shopify App Proxy contract tests; activate in Sprint 2 (S2-T2)
      - name: "[Placeholder] Shopify App Proxy Contract Tests"
        run: |
          echo "App Proxy contract verification will execute here upon Sprint 2 completion."

  docker:
    name: Docker Build, Full-Stack Smoke Test & GHCR Push
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Built ONCE: the image smoke-tested below is byte-for-byte the image pushed and deployed.
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same script staging runs: web + worker + scheduler + Postgres 16 + Redis 7 + Caddy, migrations, /health.
      - name: Smoke test full stack via scripts/deploy-staging.sh
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="$(grep ':sha-' <<< "$TAGS")"
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=$(docker run --rm "$IMAGE" php artisan key:generate --show)|" .env
          DOCKER_IMAGE="$IMAGE" bash scripts/deploy-staging.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq --filter name=northwind-staging); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$c")"; docker logs --tail 100 "$c"; echo "::endgroup::"
          done

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -n1 docker push
