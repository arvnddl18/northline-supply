name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script_stop: true
          envs: GITHUB_SHA
          script: |
            set -e
            APP_DIR="${{ secrets.STAGING_PATH || '/var/www/northwind' }}"
            echo "=== [1/6] Navigating to application directory: $APP_DIR ==="
            cd "$APP_DIR"

            echo "=== [2/6] Pulling latest repository code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== [3/6] Starting Docker Compose staging stack ==="
            docker compose -f docker-compose.staging.yml pull || true
            docker compose -f docker-compose.staging.yml build
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            echo "=== [4/6] Running database migrations ==="
            docker compose -f docker-compose.staging.yml exec -T app php artisan migrate --force

            echo "=== [5/6] Optimizing configuration & route caches ==="
            docker compose -f docker-compose.staging.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.staging.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.staging.yml exec -T app php artisan queue:restart

            echo "=== [6/6] Verifying application health endpoint ==="
            docker compose -f docker-compose.staging.yml exec -T app curl -fsS http://localhost/health

            # shortcut: Placeholder for Sentry release tracking; activate when SENTRY_AUTH_TOKEN is configured in secrets
            echo "=== [Placeholder] Sentry Release Notification ==="
            echo "Release tracking will record deployment for commit: $GITHUB_SHA"

            # shortcut: Placeholder for automated Stripe webhook listener verification (Sprint 3)
            echo "=== [Placeholder] Stripe Webhook Ping ==="
            echo "Webhook listener verification will probe Stripe test webhook receiver once endpoints are exposed."

            echo "Staging deployment completed successfully for commit $GITHUB_SHA!"

