services:
  caddy:
    image: caddy:2-alpine
    container_name: northwind-staging-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - STAGING_DOMAIN=${STAGING_DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@northwindceramics.com.au}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - northwind-staging-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-northwind-payment-app:staging}
    container_name: northwind-staging-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - northwind-staging-net

  worker:
    image: ${DOCKER_IMAGE:-northwind-payment-app:staging}
    container_name: northwind-staging-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file:
      - .env
    environment:
      - APP_ENV=staging
      - LOG_CHANNEL=stderr
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - northwind-staging-net

  scheduler:
    image: ${DOCKER_IMAGE:-northwind-payment-app:staging}
    container_name: northwind-staging-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      - APP_ENV=staging
      - LOG_CHANNEL=stderr
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - northwind-staging-net

  postgres:
    image: postgres:16-alpine
    container_name: northwind-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-northwind_payment}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-northwind_payment}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - northwind-staging-net

  redis:
    image: redis:7-alpine
    container_name: northwind-staging-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - northwind-staging-net

networks:
  northwind-staging-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  storage_data:
